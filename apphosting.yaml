# Firebase App Hosting Configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

# Settings for the Cloud Run instance
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables
env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
